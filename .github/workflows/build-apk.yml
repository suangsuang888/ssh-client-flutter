name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform (keep our lib/ and pubspec)
        run: |
          mkdir -p /tmp/src
          cp -r lib pubspec.yaml analysis_options.yaml /tmp/src/
          flutter create --platforms=android --project-name ssh_client --org com.suangsuang .
          rm -rf lib
          cp -r /tmp/src/lib lib
          cp /tmp/src/pubspec.yaml pubspec.yaml
          cp /tmp/src/analysis_options.yaml analysis_options.yaml

      - name: Set compileSdk 36 (required by newer plugins)
        run: |
          GRADLE=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE"
          grep -n compileSdk "$GRADLE"

      - name: Add INTERNET permission for release build
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          grep -n INTERNET "$MANIFEST"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
